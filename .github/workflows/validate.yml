name: Java lab checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test on Linux
        if: runner.os != 'Windows'
        run: sh tools/test.sh
      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/Build.ps1 -Test
      - name: Parse optional Windows infrastructure scripts
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Package verified Java application
        if: runner.os == 'Linux'
        run: sha256sum .build/active-directory-lab.jar > .build/SHA256SUMS.txt
      - name: Upload runnable Java application
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: active-directory-lab-java21
          path: |
            .build/active-directory-lab.jar
            .build/SHA256SUMS.txt
          retention-days: 14
