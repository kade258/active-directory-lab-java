# Copy to config/ldap.properties and change values for your isolated lab.
# This file must never contain a password. The Java process prompts for it.
ldap.url=ldaps://dc01.lab.example.test:636
ldap.rootDn=OU=Lab,DC=lab,DC=example,DC=test
ldap.upnSuffix=lab.example.test
# Use a dedicated operator with delegated rights only over OU=Lab.
ldap.bindDn=lab.operator@lab.example.test
